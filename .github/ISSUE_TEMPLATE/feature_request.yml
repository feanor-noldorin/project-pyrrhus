name: Feature request
description: Something the port could add (display options, controls, accessibility)
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Gameplay changes stay optional and off by default. Please check [FEATURES.md](https://github.com/undecuple/project-pyrrhus/blob/main/docs/FEATURES.md) first: it lists what is planned.
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today (on the PS3 or in another port), if at all?
